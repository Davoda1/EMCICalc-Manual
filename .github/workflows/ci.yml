name: Manual CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate manual
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify build prerequisites
        run: |
          python3 --version
          php --version
          php -r 'exit(extension_loaded("ctype") ? 0 : 1);'
      - name: Build with Gopher
        run: python3 tools/build.py
      - name: Check links, assets and source privacy
        run: python3 tools/check_site.py
      - name: Verify committed website matches source
        run: |
          git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard -- docs)"
